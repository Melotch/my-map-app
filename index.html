<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мониторинг маршрутов фабрики</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet" />

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            bottom: 0;
        }

        /* Стильная темная панель управления поверх карты */
        .route-sidebar {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 9999; /* Поверх карты */
            background: rgba(24, 28, 36, 0.95);
            color: #e0e6ed;
            padding: 20px;
            border-radius: 12px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 320px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
        }

        .sidebar-header h3 {
            margin: 0 0 4px 0;
            font-size: 18px;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .sidebar-header .sub-title {
            font-size: 12px;
            color: #8898aa;
        }

        .route-sidebar hr {
            border: 0;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin: 14px 0;
        }

        .route-group {
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            border-left: 4px solid #4a5568;
            transition: all 0.2s ease;
        }

        .route-group:hover {
            background: rgba(255, 255, 255, 0.05);
            border-left-color: #3498db;
        }

        .route-group-title {
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            user-select: none;
            color: #fff;
        }

        .route-group-title input {
            margin-right: 12px;
            accent-color: #3498db;
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        .group-routes-list {
            margin-top: 10px;
            padding-left: 4px;
        }

        .route-item {
            display: flex;
            align-items: center;
            margin: 8px 0;
            font-size: 13px;
            cursor: pointer;
            color: #cbd5e1;
            user-select: none;
        }

        .route-item:hover {
            color: #fff;
        }

        .route-item input {
            margin-right: 10px;
            accent-color: #3498db;
            cursor: pointer;
            width: 14px;
            height: 14px;
        }

        .color-bullet {
            display: inline-block;
            width: 8px;
            height: 8px;
            margin-right: 10px;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(0,0,0,0.6);
        }

        /* Кастомный скроллбар для панели */
        .route-sidebar::-webkit-scrollbar {
            width: 6px;
        }
        .route-sidebar::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
        }
        .route-sidebar::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="map-control-panel" class="route-sidebar">
        <div class="sidebar-header">
            <h3>Диспетчер маршрутов</h3>
            <span class="sub-title">Управление подразделениями фабрики</span>
        </div>
        <hr>
        <div id="groups-container"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="main.js"></script>
</body>
</html>
