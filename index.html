<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта с маршрутами и расписанием</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100vw; }
        #route-selector { 
            position: absolute; 
            top: 10px; 
            right: 10px; 
            z-index: 1000; 
            padding: 15px; 
            background: white; 
            border-radius: 8px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.3); 
        }
        #route-selector h3 { margin-top: 0; font-size: 16px; }
        #route-selector button { display: block; width: 100%; margin-bottom: 5px; cursor: pointer; padding: 5px; }
        
        #schedule-popup { 
            display: none; 
            position: absolute; 
            right: 10px; 
            bottom: 20px; 
            width: 280px; 
            padding: 15px; 
            background: white; 
            border-radius: 8px; 
            box-shadow: 0 0 15px rgba(0,0,0,0.3); 
            z-index: 1000;
        }
        #schedule-text { width: 100%; margin: 10px 0; font-family: sans-serif; font-size: 13px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="route-selector">
        <h3>Выберите маршрут:</h3>
        <button onclick="showRoute(1)">РУ — ФП</button>
        <button onclick="showRoute(2)">ТЦ Славянка — ФП</button>
    </div>

    <div id="schedule-popup">
        <h3 id="route-title" style="margin:0; font-size: 16px;">Расписание</h3>
        <textarea id="schedule-text" rows="6" readonly></textarea>
        <button onclick="hidePopup()" style="width: 100%;">Закрыть</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.3/dist/leaflet.js"></script>
    <script>
        // Инициализация карты
        const map = L.map('map').setView([51.2776, 37.7265], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let currentRouteLayer = null;

        // Данные маршрутов
        const geojsonData1 = {
            "type": "FeatureCollection",
            "features": [{
                "type": "Feature",
                "geometry": {
                    "type": "LineString",
                    "coordinates": [
                        [37.726534, 51.277664], [37.732098, 51.278067], [37.745221, 51.280963],
                        [37.770959, 51.282731], [37.810819, 51.277955], [37.794718, 51.243227]
                    ]
                }
            }]
        };

        const geojsonData2 = {
            "type": "FeatureCollection",
            "features": [{
                "type": "Feature",
                "geometry": {
                    "type": "LineString",
                    "coordinates": [
                        [37.8823, 51.3242], [37.8853, 51.3215], [37.8904, 51.3170]
                    ]
                }
            }]
        };

        function showRoute(routeNumber) {
            // Удаляем старый слой, если он есть
            if (currentRouteLayer) {
                map.removeLayer(currentRouteLayer);
            }

            let data, color, title, schedule;

            if (routeNumber === 1) {
                data = geojsonData1;
                color = "blue";
                title = "Маршрут: РУ-ФП";
                schedule = "06:25 (до ФОК); 06:35 (до ФОК); 07:00; 08:05; 14:30; 16:10; 18:10; 22:25";
            } else {
                data = geojsonData2;
                color = "red";
                title = "Маршрут: ТЦ Славянка-ФП";
                schedule = "06:30 (до ФОК); 07:30; 14:30; 18:20; 22:30";
            }

            // Отрисовка на карте
            currentRouteLayer = L.geoJSON(data, { style: { color: color, weight: 6, opacity: 0.8 } }).addTo(map);
            map.fitBounds(currentRouteLayer.getBounds());

            // Показ расписания
            document.getElementById('route-title').innerText = title;
            document.getElementById('schedule-text').value = schedule;
            document.getElementById('schedule-popup').style.display = 'block';
        }

        function hidePopup() {
            document.getElementById('schedule-popup').style.display = 'none';
        }
    </script>
</body>
</html>
