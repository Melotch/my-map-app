<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта маршрутов</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        /* Панель управления маршрутами */
        .route-sidebar {
            width: 320px;
            max-height: 80vh;
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 9999;
            background: rgba(24, 28, 36, 0.95);
            color: #e0e6ed;
            padding: 20px;
            border-radius: 12px;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
        }

        .route-group {
            margin-bottom: 20px;
        }

        .route-group-title {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .group-checkbox, .route-checkbox {
            margin-right: 10px;
            cursor: pointer;
        }

        .group-routes-list {
            padding-left: 15px;
            margin-top: 5px;
        }

        .route-item {
            display: flex;
            align-items: center;
            margin: 8px 0;
            font-size: 14px;
            cursor: pointer;
        }

        /* Цветные маркеры (кругляшки) в меню */
        .color-bullet {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
        }

        /* --- НОВЫЕ КРАСИВЫЕ СТИЛИ ДЛЯ ЦВЕТНЫХ ОСТАНОВОК --- */
        .stop-marker-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Белая точка, цвет рамки подставится из JS */
        .stop-marker-body {
            width: 12px;
            height: 12px;
            background-color: #ffffff;
            border: 3px solid #333; 
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
            position: relative;
            z-index: 2;
        }

        /* Название остановки рядом с точкой */
        .stop-title {
            position: absolute;
            left: 18px;
            top: -5px;
            background-color: rgba(24, 28, 36, 0.9);
            color: #e0e6ed;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* Эффект пульсации под остановкой */
        .stop-marker-pulse {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            opacity: 0.4;
            animation: pulse 2s infinite;
            z-index: 1;
        }

        @keyframes pulse {
            0% { transform: scale(0.5); opacity: 0.6; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        /* ------------------------------------------------ */

        /* Для планшетов (768px–1024px) */
        @media (max-width: 1024px) {
            .route-sidebar {
                width: 280px;
                padding: 16px;
            }
            .route-group-title {
                font-size: 14px;
            }
        }

        /* Для мобильных (<768px) */
        @media (max-width: 768px) {
            .route-sidebar {
                position: fixed;
                top: 0;
                left: -340px; /* Спрятано за экраном */
                bottom: 0;
                width: 300px;
                max-height: none;
                border-radius: 0;
                transition: left 0.3s ease;
                z-index: 10000;
            }

            /* Состояние открытой панели */
            .route-sidebar.active {
                left: 0;
            }

            /* Кнопка-бургер для открытия меню */
            .menu-toggle {
                position: fixed;
                top: 15px;
                right: 15px;
                z-index: 10001;
                background: rgba(24, 28, 36, 0.9);
                color: white;
                border: 1px solid rgba(255,255,255,0.1);
                padding: 10px 15px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
                display: block;
            }
        }

        /* По умолчанию скрываем бургер на десктопах */
        @media (min-width: 769px) {
            .menu-toggle {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="route-sidebar" id="routeSidebar">
        </div>

    <button class="menu-toggle" id="menuToggle">☰ Меню</button>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="main.js"></script>
</body>
</html>
