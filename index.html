<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта маршрутов</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        /* Адаптивность панели управления */
        .route-sidebar {
            width: 320px;
            max-height: 80vh;
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 9999;
            background: rgba(24, 28, 36, 0.95);
            color: #e0e6ed;
            padding: 20px;
            border-radius: 12px;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
        }

        .route-group {
            margin-bottom: 15px;
        }

        .route-group-title {
            font-weight: bold;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .route-toggle {
            margin-right: 8px;
            font-size: 16px;
        }

        .route-list {
            padding-left: 20px;
        }

        .route-item {
            margin: 5px 0;
        }

        .route-checkbox {
            margin-right: 8px;
        }

        /* Для планшетов (768px–1024px) */
        @media (max-width: 1024px) {
            .route-sidebar {
                width: 280px;
                padding: 16px;
            }
            .route-group-title {
                font-size: 13px;
            }
        }

        /* Для мобильных (<768px) */
        @media (max-width: 768px) {
            .route-sidebar {
                position: fixed;
                top: 0;
                left: -320px; /* Спрятано за экраном */
                bottom: 0;
                width: 300px;
                max-height: none;
                border-radius: 0;
                transition: left 0.3s ease;
                z-index: 10000;
            }

            /* Состояние открытой панели */
            .route-sidebar.open {
                left: 0;
            }

            /* Кнопка-бургер для открытия меню */
            .menu-toggle {
                position: fixed;
                top: 15px;
                right: 15px;
                z-index: 10001;
                background: rgba(24, 28, 36, 0.9);
                color: white;
                border: none;
                padding: 8px 12px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
            }
        }

        .stop-marker {
            text-align: center;
        }
        .stop-icon {
            background: #ff6b6b;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <!-- Панель управления маршрутами -->
    <div class="route-sidebar" id="routeSidebar">
        <!-- Меню будет сгенерировано автоматически -->
    </div>

    <!-- Кнопка для мобильных устройств -->
    <button class="menu-toggle" onclick="toggleMenu()">☰ Меню</button>

    <!-- Подключаем Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Наш JS-код -->
    <script src="script.js"></script>
</body>
</html>
