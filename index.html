    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { height: 100vh; width: 100vw; }
        
        #route-selector { 
            position: absolute; 
            top: 10px; 
            right: 10px; 
            z-index: 1000; 
            padding: 15px; 
            background: white; 
            border-radius: 8px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.3); 
        }
        #route-selector h3 { margin-top: 0; font-size: 16px; margin-bottom: 10px; }

            display: block; 
            width: 100%; 
            margin-bottom: 5px; 
            cursor: pointer; 
            padding: 8px;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        #route-selector button:hover { background: #e2e6ea; }
        
        #schedule-popup { 
            display: none; 
            position: absolute; 
            right: 10px; 
            bottom: 20px; 
            width: 280px; 
            padding: 15px; 
            background: white; 
            border-radius: 8px; 
            box-shadow: 0 0 15px rgba(0,0,0,0.3); 
            z-index: 1000;
        }
        #schedule-text { 
            width: 100%; 
            margin: 10px 0; 
            font-family: inherit; 
            font-size: 13px; 
            resize: none; 
            box-sizing: border-box;
            padding: 5px;
        }
    </style>

        // --- 3. Функции управления ---
        function showRoute(routeNumber) {
            // Удаляем старый слой, если он есть
            if (currentRouteLayer) {
                map.removeLayer(currentRouteLayer);
            }

            let data, color, title, schedule;

            if (routeNumber === 1) {
                data = geojsonData1;
                color = "blue";
                title = "Маршрут: РУ — ФП";
                schedule = "06:25 (до ФОК); 06:35 (до ФОК); 07:00; 08:05; 14:30; 16:10; 18:10; 22:25";
            } else if (routeNumber === 2) {
                data = geojsonData2;
                color = "red";
                title = "Маршрут: ТЦ Славянка — ФП";
                schedule = "06:30 (до ФОК); 07:30; 14:30; 18:20; 22:30";
            }

            // Отрисовка на карте
            currentRouteLayer = L.geoJSON(data, { 
                style: { color: color, weight: 6, opacity: 0.8 } 
            }).addTo(map);

            // Автоматическая подстройка масштаба под маршрут
            map.fitBounds(currentRouteLayer.getBounds());

            // Показ расписания
            document.getElementById('route-title').innerText = title;
            document.getElementById('schedule-text').value = schedule;
            document.getElementById('schedule-popup').style.display = 'block';
        }

        function hidePopup() {
            document.getElementById('schedule-popup').style.display = 'none';
        }
