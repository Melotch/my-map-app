<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта маршрутов</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        /* Панель управления маршрутами */
        .route-sidebar {
            width: 320px;
            max-height: 80vh;
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 9999;
            background: rgba(24, 28, 36, 0.95);
            color: #e0e6ed;
            padding: 20px;
            border-radius: 12px;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
        }

        .route-group {
            margin-bottom: 20px;
        }

        .route-group-title {
            font-weight: bold;
            font-size: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
        }

        .group-checkbox, .route-checkbox {
            margin-right: 10px;
            cursor: pointer;
        }

        .group-routes-list {
            padding-left: 15px;
            margin-top: 5px;
        }

        .route-item {
            display: flex;
            align-items: center;
            margin: 8px 0;
            font-size: 14px;
            cursor: pointer;
        }

        /* Цветные маркеры (кругляшки) в меню */
        .color-bullet {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
        }

        /* --- НОВЫЕ КРАСИВЫЕ СТИЛИ ДЛЯ ЦВЕТНЫХ ОСТАНОВОК --- */
        .stop-marker-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Белая точка, цвет рамки подставится из JS */
        .stop-marker-body {
            width: 12px;
            height: 12px;
            background-color: #ffffff;
            border: 3px solid #333; 
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
            position: relative;
            z-index: 2;
        }

        /* Название остановки рядом с точкой */
        .stop-title {
            position: absolute;
            left: 18px;
            top: -5px;
            background-color: rgba(24, 28, 36, 0.9);
            color: #e0e6ed;
            padding: 3px 8px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        /* Эффект пульсации под остановкой */
        .stop-marker-pulse {
            position: absolute;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            opacity: 0.4;
            animation: pulse 2s infinite;
            z-index: 1;
        }

        @keyframes pulse {
            0% { transform: scale(0.5); opacity: 0.6; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        /* ------------------------------------------------ */

        /* Для планшетов (768px–1024px) */
        @media (max-width: 1024px) {
            .route-sidebar {
                width: 280px;
                padding: 16px;
            }
            .route-group-title {
                font-size: 14px;
            }
        }

        /* Для мобильных (<768px) */
        @media (max-width: 768px) {
            .route-sidebar {
                position: fixed;
                top: 0;
                left: -340px; /* Спрятано за экраном */
                bottom: 0;
                width: 300px;
                max-height: none;
                border-radius: 0;
                transition: left 0.3s ease;
                z-index: 10000;
            }

            /* Состояние открытой панели */
            .route-sidebar.active {
                left: 0;
            }

            /* Кнопка-бургер для открытия меню */
            .menu-toggle {
                position: fixed;
                top: 15px;
                right: 15px;
                z-index: 10001;
                background: rgba(24, 28, 36, 0.9);
                color: white;
                border: 1px solid rgba(255,255,255,0.1);
                padding: 10px 15px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 14px;
                display: block;
            }
        }

        /* По умолчанию скрываем бургер на десктопах */
        @media (min-width: 769px) {
            .menu-toggle {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="route-sidebar" id="routeSidebar">
        </div>

    <button class="menu-toggle" id="menuToggle">☰ Меню</button>
    <div id="schedule-panel" class="schedule-sidebar" style="display: none;">
    <div class="sidebar-header">
        <h3>Расписание движения</h3>
        <span id="schedule-route-name" class="sub-title">Маршрут не выбран</span>
    </div>
    <hr>
    <div id="schedule-list" class="time-grid">
        </div>
</div>

<style>
/* Стили для правого окошка расписания */
.schedule-sidebar {
    position: absolute;
    top: 20px;
    right: 20px; /* В отличие от диспетчера, это окно справа */
    z-index: 9999;
    background: rgba(24, 28, 36, 0.95);
    color: #e0e6ed;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    width: 260px;
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(8px);
    font-family: 'Segoe UI', Roboto, sans-serif;
}
.time-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
}
.time-tag {
    background: rgba(52, 152, 219, 0.2);
    color: #3498db;
    border: 1px solid rgba(52, 152, 219, 0.4);
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    flex: 1 1 calc(33.33% - 8px); /* Ровные плашки в 3 колонки */
}
    /* АДАПТИВ ДЛЯ СМАРТФОНОВ (Экраны меньше 768px) */
@media (max-width: 768px) {
    /* Панель диспетчера (слева) */
    .route-sidebar {
        top: 10px;
        left: 10px;
        width: calc(100% - 20px); /* Растягиваем почти на всю ширину экрана */
        max-height: 35vh; /* Ограничиваем по высоте, чтобы видеть карту */
        padding: 12px;
        font-size: 14px;
    }

    /* Панель расписания (справа) */
    .schedule-sidebar {
        top: auto; /* Сбрасываем фиксацию сверху */
        bottom: 10px; /* Прижимаем к самому низу экрана */
        left: 10px;
        right: 10px;
        width: calc(100% - 20px); /* Тоже во всю ширину */
        max-height: 30vh;
        padding: 12px;
    }

    /* Делаем плашки времени чуть крупнее, чтобы по ним было удобно тапать пальцем */
    .time-tag {
        padding: 6px 10px;
        font-size: 15px;
    }
    
    .sidebar-header h3 {
        font-size: 16px;
    }
}
</style>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="main.js"></script>
</body>
</html>
