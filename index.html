<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карта с маршрутами и расписанием</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.3/dist/leaflet.css" />
	<link rel="icon" href="data:," />
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%;}

        #route-selector {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            padding: 15px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0.3);
        }
        #route-selector h3 { margin-top: 0; font-size: 16px; margin-bottom: 10px; }
        #route-selector button {
            display: block;
            width: 100%;
            margin-bottom: 5px;
            cursor: pointer;
            padding: 8px;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        #route-selector button:hover { background: #e2e6ea; }

        #schedule-popup {
            display: none;
            position: absolute;
            right: 10px;
            bottom: 20px;
            width: 280px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0.3);
            z-index: 1000;
        }
        #schedule-text {
            width: 100%;
            margin: 10px 0;
            font-family: inherit;
            font-size: 13px;
            resize: none;
            box-sizing: border-box;
            padding: 5px;
        }

        .stop-marker {
            background-color: #4CAF50;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0.4);
        }
		.leaflet-control-attribution .leaflet-attribution-flag {
            display: none !important;
		}
		.leaflet-control-attribution {
  display: none !important;
        }
    </style>
</head>

        // Функция отображения маршрута
        function showRoute(routeId) {
            // Удаляем предыдущий маршрут и маркеры
            if (currentRouteLayer) {
                map.removeLayer(currentRouteLayer);
            }
            stopMarkers.forEach(marker => map.removeLayer(marker));
            stopMarkers = [];
			// Добавляем маркеры остановок из stopsData
            stopsData[routeId].forEach(stop => {
                const marker = L.circleMarker([stop[1], stop[0]], {
                    radius: 8,
            color: '#4CAF50',
            fillColor: '#4CAF50',
            fillOpacity: 0.8
        }).addTo(map).bindPopup(`<b>${stop[2]}</b><br>${stop[3]}`)
                stopMarkers.push(marker);
            });

            // Отображаем маршрут
            const routeData = routeId === 1 ? geojsonData1 : geojsonData2;
            currentRouteLayer = L.geoJSON(routeData, {
                style: function (feature) {
                    return { color: routeId === 1 ? '#FF0000' : '#0000FF', weight: 5 };
        }
            }).addTo(map);

            // Показываем расписание
            document.getElementById('route-title').textContent = `Расписание маршрута ${routeId}`;
            document.getElementById('schedule-text').value = schedules[routeId];
            document.getElementById('schedule-popup').style.display = 'block';

    // Автоматически центрируем карту на маршруте
    map.fitBounds(currentRouteLayer.getBounds());
}

function hidePopup() {
    document.getElementById('schedule-popup').style.display = 'none';
